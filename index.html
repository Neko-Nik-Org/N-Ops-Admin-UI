<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="N-Ops Admin — sign in to the infrastructure control plane." />
    <!--
      First-paint theme. Saved settings (the chosen theme included) are encrypted and only the app can
      read them, so until it starts this follows the system's light / dark setting.
    -->
    <script>
      document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
    </script>
    <!--
      Page background before the app starts, so the first paint isn't a blank white page. The app's own
      animated loader (ScreenLoader) takes over as soon as it mounts. Colors match the ink token in src/index.css.
    -->
    <style>
      html {
        background: #06080c;
        color-scheme: dark;
      }
      html[data-theme='light'] {
        background: #f4f6f8;
        color-scheme: light;
      }
    </style>
    <!-- Cloudflare Turnstile is loaded on demand by TurnstileWidget (sign-in page only) -->
    <title>N-Ops Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- runtime config (API URL, Turnstile key); written by the container on start, see docker/write-env.mjs -->
    <script src="/env.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
