name: CI/CD

# One pipeline, one image build:
#   pull requests     -> verify, build the image and smoke-test it (no secrets used)
#   push to main/tags -> the same, then push that image to Docker Hub and deploy it
on:
  pull_request:
  push:
    branches: [main]
    tags: ["*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # superseded PR runs are cancelled; runs on main/tags queue so a deploy is never cut off halfway
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # no VITE_* needed: config is read at container start, not at build time
      - run: npm run build

  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The only real build. Its layers go to the GitHub Actions cache so the push step below
      # reuses them instead of building again.
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: n-ops-admin-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # the container must start, write env.js from its environment, and serve the app
      - name: Smoke test
        run: |
          docker run -d --name admin-ui -p 8080:8080 \
            -e API_BASE_URL=https://api.example.test/ \
            -e TURNSTILE_SITE_KEY=1x00000000000000000000AA \
            n-ops-admin-ui:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/ >/dev/null && break; sleep 1; done
          curl -fs http://localhost:8080/ | grep -q '<div id="root">'
          curl -fs http://localhost:8080/env.js | tee /dev/stderr | grep -q '"API_BASE_URL":"https://api.example.test"'
          curl -fs http://localhost:8080/some/deep/route | grep -q '<div id="root">'   # SPA fallback
          # a container without config must refuse to start
          if docker run --rm n-ops-admin-ui:ci; then echo "started without config" && exit 1; fi

      - name: Container logs
        if: always()
        run: docker logs admin-ui || true

      # Push-only from here: these steps use registry secrets, so they never run for pull requests.
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Every layer comes from the cache filled above, so this only exports the tested image
      # (plus its SBOM and provenance, which a `load` build can't carry).
      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: true
          cache-from: type=gha
          tags: |
            neko7nik/n-ops-admin-ui:latest
            neko7nik/n-ops-admin-ui:${{ github.ref_name }}

  deploy:
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          ssh -o StrictHostKeyChecking=no root@$SERVER_IP << 'EOF'
            set -e
            cd /srv/n-ops-admin-ui
            # The image has no URLs baked in; without runtime config the app can't reach the API.
            test -f .env || { echo "Missing /srv/n-ops-admin-ui/.env"; exit 1; }
            grep -q "env_file" docker-compose.y*ml || { echo "docker-compose on the server has no env_file: .env"; exit 1; }
            docker compose pull
            docker compose up -d
            docker ps
          EOF
