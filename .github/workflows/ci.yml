name: CI

# Checks only, no secrets: safe for pull requests. Publishing and deploying is in
# docker-build-and-deploy.yaml (push to main / tags).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # no VITE_* needed: config is read at container start, not at build time
      - run: npm run build

  docker:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: n-ops-admin-ui:ci

      # the container must start, write env.js from its environment, and serve the app
      - name: Smoke test
        run: |
          docker run -d --name admin-ui -p 8080:8080 \
            -e API_BASE_URL=https://api.example.test/ \
            -e TURNSTILE_SITE_KEY=1x00000000000000000000AA \
            n-ops-admin-ui:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/ >/dev/null && break; sleep 1; done
          curl -fs http://localhost:8080/ | grep -q '<div id="root">'
          curl -fs http://localhost:8080/env.js | tee /dev/stderr | grep -q '"API_BASE_URL":"https://api.example.test"'
          curl -fs http://localhost:8080/some/deep/route | grep -q '<div id="root">'   # SPA fallback
          # a container without config must refuse to start
          if docker run --rm n-ops-admin-ui:ci; then echo "started without config" && exit 1; fi

      - name: Container logs
        if: always()
        run: docker logs admin-ui || true
