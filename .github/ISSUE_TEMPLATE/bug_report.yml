name: Bug report
description: Something in the Admin UI doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Security issues must not be reported here**, see SECURITY.md.
        Remove tokens, secrets, and personal data from anything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: UI version or commit
      placeholder: e.g. neko7nik/n-ops-admin-ui:latest, or commit a9d0bea
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Firefox 150 on Ubuntu 26.04
  - type: textarea
    id: logs
    attributes:
      label: Console or network output
      description: Relevant browser console errors or failed API responses, with secrets removed.
      render: text
