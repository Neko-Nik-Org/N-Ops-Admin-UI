name: Feature request
description: Suggest an improvement or a new feature for the Admin UI
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and why the current UI falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Does it need a Main API change?
      options:
        - "No, the API already supports it"
        - "Yes, it needs a new or changed endpoint"
        - "Not sure"
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
